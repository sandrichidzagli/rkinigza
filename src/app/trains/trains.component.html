<app-header></app-header>

<div class="trains-page">
  <section class="trains-hero">
    <h1>{{ t('trainsHeroTitle') }}</h1>
  </section>

  <div class="trains-body">
    <h2 class="list-heading">{{ t('trainListHeading') }}</h2>

    <div class="train-list">
      <div *ngIf="loading" class="state-msg loading-msg">{{ t('loading') }}</div>
      <div *ngIf="error" class="state-msg error-msg">{{ error }}</div>
      <div *ngIf="!loading && !error && trains.length === 0" class="state-msg">
        {{ t('noTrains') }}
      </div>

      <div class="train-card" *ngFor="let train of trains">
        <div class="train-info">
          <strong class="train-number">{{ train.number }}</strong>
          <p class="train-route">{{ train.from }} → {{ train.to }}</p>
        </div>
        <div class="train-time">
          <strong>{{ train.departure }}</strong>
          <p>{{ t('departureLbl') }}</p>
        </div>
        <div class="train-time">
          <strong>{{ train.arrive }}</strong>
          <p>{{ t('arrivalLbl') }}</p>
        </div>
        <button class="book-btn" (click)="selectTrain(train)">{{ t('bookBtn') }}</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
